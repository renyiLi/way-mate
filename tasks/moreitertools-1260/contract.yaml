    - cmd: python -m pytest tests/test_recipes.py::RunningWindowSizeTests::test_noninteger_window tests/test_recipes.py::RunningWindowSizeTests::test_nonpositive_index -q
      timeout_s: 180

  lint:
    tool: ruff
