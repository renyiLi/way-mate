[project]
name = "delivery-bench"
version = "0.1.0"
description = "以可执行验收契约为中心的多模型协作交付工作台"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 显式声明规则集：闸门与开发共用同一套判定，避免"本机能过、换台机器不过"
select = ["E4", "E7", "E9", "F"]
