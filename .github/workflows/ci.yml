name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 只做静态检查，不跑 black —— 格式不作为门禁，避免无意义的整文件改动
      - name: 静态检查（ruff）
        run: ruff check src scripts tests

      # 契约里的 exact 段与测试断言不得漂移
      - name: 契约一致性检查
        run: python scripts/extract_exact.py --check

      # 30 条测试全部用脚本化假适配器，不需要任何 API Key
      - name: 单元测试（离线）
        run: python -m pytest -q
